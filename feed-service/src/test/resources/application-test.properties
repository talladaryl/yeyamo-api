spring.application.name=feed-service-test

# Disable external services
spring.cloud.config.enabled=false
spring.cloud.discovery.enabled=false
eureka.client.enabled=false

# H2 Database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# Redis (embedded or mock)
spring.data.redis.host=localhost
spring.data.redis.port=6370

# Kafka disabled for tests
spring.kafka.bootstrap-servers=localhost:9092
yeyamo.kafka.enabled=false
spring.kafka.consumer.group-id=feed-service-test

# Ads disabled by default in tests
yeyamo.ads.enabled=false
yeyamo.ads.feed.enabled=false
yeyamo.ads.feed.max-per-page=3
yeyamo.ads.feed.organic-per-ad=8

# Logging
logging.level.com.yeyamo_mobile.api.feed_service=DEBUG
