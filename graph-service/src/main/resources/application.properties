spring.application.name=graph-service
server.port=8116
spring.cloud.config.username=${CONFIG_SERVER_USERNAME}
spring.cloud.config.password=${CONFIG_SERVER_PASSWORD}
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://config-server:8080}
spring.neo4j.uri=${NEO4J_URI:bolt://neo4j:7687}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:CHANGE_ME}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
spring.kafka.consumer.group-id=graph-service
spring.kafka.consumer.auto-offset-reset=earliest
yeyamo.kafka.topics.graph-source-events=${GRAPH_SOURCE_TOPICS:culture.events,catalog.events,partner-events,place.events,event.events}
yeyamo.kafka.topics.graph-commands=${GRAPH_COMMAND_TOPIC:graph.commands}
jwt.secret=${JWT_SECRET:change-me-change-me-change-me-change-me}
management.endpoints.web.exposure.include=health,info,metrics
