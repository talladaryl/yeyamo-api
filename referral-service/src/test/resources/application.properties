spring.cloud.config.enabled=false
eureka.client.enabled=false
spring.datasource.url=jdbc:h2:mem:referral_service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=false
spring.kafka.listener.auto-startup=false
spring.data.redis.repositories.enabled=false
referral.outbox.enabled=false
jwt.secret=referral-test-secret-with-at-least-32-bytes
referral.antifraud.max-daily-attributions=20
referral.antifraud.max-device-attributions=3
spring.autoconfigure.exclude=org.springframework.boot.security.oauth2.server.resource.autoconfigure.servlet.OAuth2ResourceServerAutoConfiguration
