# Dokploy production composition. It deliberately extends the local compose
# service definitions so that service names, healthchecks and dependencies stay
# aligned with docker-compose.yml while host port bindings and local config
# mounts are removed.
name: yeyamo-production

x-java-limits: &java-limits
  resources:
    limits:
      cpus: "${JAVA_CPU_LIMIT:-0.5}"
      memory: "${JAVA_MEMORY_LIMIT:-512M}"

x-postgres-limits: &postgres-limits
  resources:
    limits:
      cpus: "${POSTGRES_CPU_LIMIT:-1.0}"
      memory: "${POSTGRES_MEMORY_LIMIT:-1024M}"

x-postgres-init-limits: &postgres-init-limits
  resources:
    limits:
      cpus: "${POSTGRES_INIT_CPU_LIMIT:-0.25}"
      memory: "${POSTGRES_INIT_MEMORY_LIMIT:-256M}"

x-redis-limits: &redis-limits
  resources:
    limits:
      cpus: "${REDIS_CPU_LIMIT:-0.25}"
      memory: "${REDIS_MEMORY_LIMIT:-256M}"

x-kafka-limits: &kafka-limits
  resources:
    limits:
      cpus: "${KAFKA_CPU_LIMIT:-1.0}"
      memory: "${KAFKA_MEMORY_LIMIT:-768M}"

x-kafka-init-limits: &kafka-init-limits
  resources:
    limits:
      cpus: "${KAFKA_INIT_CPU_LIMIT:-0.25}"
      memory: "${KAFKA_INIT_MEMORY_LIMIT:-128M}"

x-opensearch-limits: &opensearch-limits
  resources:
    limits:
      cpus: "${OPENSEARCH_CPU_LIMIT:-1.0}"
      memory: "${OPENSEARCH_MEMORY_LIMIT:-768M}"

x-neo4j-limits: &neo4j-limits
  resources:
    limits:
      cpus: "${NEO4J_CPU_LIMIT:-0.75}"
      memory: "${NEO4J_MEMORY_LIMIT:-768M}"

x-spring-infra-limits: &spring-infra-limits
  resources:
    limits:
      cpus: "${SPRING_INFRA_CPU_LIMIT:-0.5}"
      memory: "${SPRING_INFRA_MEMORY_LIMIT:-512M}"

x-production-java-env: &production-java-env
  JAVA_TOOL_OPTIONS: "${JAVA_TOOL_OPTIONS:--Xms64m -Xmx256m -XX:+UseSerialGC -XX:ActiveProcessorCount=1}"
  CONFIG_SERVER_URL: "${CONFIG_SERVER_URL:-http://config-server:8080}"
  CONFIG_SERVER_USERNAME: "${CONFIG_SERVER_USERNAME:?CONFIG_SERVER_USERNAME is required}"
  CONFIG_SERVER_PASSWORD: "${CONFIG_SERVER_PASSWORD:?CONFIG_SERVER_PASSWORD is required}"
  SPRING_CLOUD_CONFIG_USERNAME: "${CONFIG_SERVER_USERNAME:?CONFIG_SERVER_USERNAME is required}"
  SPRING_CLOUD_CONFIG_PASSWORD: "${CONFIG_SERVER_PASSWORD:?CONFIG_SERVER_PASSWORD is required}"
  EUREKA_USERNAME: "${EUREKA_USERNAME:?EUREKA_USERNAME is required}"
  EUREKA_PASSWORD: "${EUREKA_PASSWORD:?EUREKA_PASSWORD is required}"
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://${EUREKA_USERNAME:?EUREKA_USERNAME is required}:${EUREKA_PASSWORD:?EUREKA_PASSWORD is required}@registry-service:8761/eureka"
  EUREKA_SERVER: "http://${EUREKA_USERNAME:?EUREKA_USERNAME is required}:${EUREKA_PASSWORD:?EUREKA_PASSWORD is required}@registry-service:8761/eureka/"
  EUREKA_SERVER_URL: "http://${EUREKA_USERNAME:?EUREKA_USERNAME is required}:${EUREKA_PASSWORD:?EUREKA_PASSWORD is required}@registry-service:8761/eureka/"
  SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER:?POSTGRES_USER is required}"
  SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
  DB_USERNAME: "${POSTGRES_USER:?POSTGRES_USER is required}"
  DB_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
  ADS_DB_USERNAME: "${POSTGRES_USER:?POSTGRES_USER is required}"
  ADS_DB_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
  DISCOVERY_DB_USERNAME: "${POSTGRES_USER:?POSTGRES_USER is required}"
  DISCOVERY_DB_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
  FEED_DB_USERNAME: "${POSTGRES_USER:?POSTGRES_USER is required}"
  FEED_DB_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
  JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
  INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}"
  CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}"
  SPRINGDOC_API_DOCS_ENABLED: "false"
  SPRINGDOC_SWAGGER_UI_ENABLED: "false"
  TRUST_FORWARDED_PROTO: "true"
  MAIL_HOST: "${MAIL_HOST:-smtp-relay.brevo.com}"
  MAIL_PORT: "${MAIL_PORT:-587}"
  MAIL_USERNAME: "${MAIL_USERNAME:-}"
  MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
  EMAIL_FROM_ADDRESS: "${EMAIL_FROM_ADDRESS:-}"
  EMAIL_FROM_NAME: "${EMAIL_FROM_NAME:-YeYamo}"
  PUSH_PROVIDER_ACCESS_TOKEN: "${PUSH_PROVIDER_ACCESS_TOKEN:-}"
  GOOGLE_MAPS_SERVER_API_KEY: "${GOOGLE_MAPS_SERVER_API_KEY:-}"
  PAYMENT_PROVIDER_NAME: "${PAYMENT_PROVIDER_NAME:?PAYMENT_PROVIDER_NAME is required}"
  PAYMENT_AGGREGATOR_BASE_URL: "${PAYMENT_AGGREGATOR_BASE_URL:?PAYMENT_AGGREGATOR_BASE_URL is required}"
  PAYMENT_AGGREGATOR_KEY_A: "${PAYMENT_AGGREGATOR_KEY_A:?PAYMENT_AGGREGATOR_KEY_A is required}"
  PAYMENT_AGGREGATOR_KEY_B: "${PAYMENT_AGGREGATOR_KEY_B:?PAYMENT_AGGREGATOR_KEY_B is required}"
  PAYMENT_AGGREGATOR_WEBHOOK_SECRET: "${PAYMENT_AGGREGATOR_WEBHOOK_SECRET:?PAYMENT_AGGREGATOR_WEBHOOK_SECRET is required}"
  PAYMENT_CASH_IN_CAPABILITIES: "${PAYMENT_CASH_IN_CAPABILITIES:?PAYMENT_CASH_IN_CAPABILITIES is required}"
  ADS_TOKEN_SECRET: "${ADS_TOKEN_SECRET:?ADS_TOKEN_SECRET is required and must contain at least 32 bytes}"
  TICKET_QR_PRIVATE_KEY_BASE64: "${TICKET_QR_PRIVATE_KEY_BASE64:-}"
  TICKET_QR_PUBLIC_KEY_BASE64: "${TICKET_QR_PUBLIC_KEY_BASE64:-}"
  TURNSTILE_SECRET_KEY: "${TURNSTILE_SECRET_KEY:-}"
  YEYAMO_BOOTSTRAP_ADMIN_ENABLED: "${YEYAMO_BOOTSTRAP_ADMIN_ENABLED:-false}"
  YEYAMO_BOOTSTRAP_ADMIN_EMAIL: "${YEYAMO_BOOTSTRAP_ADMIN_EMAIL:-}"
  YEYAMO_BOOTSTRAP_ADMIN_PASSWORD: "${YEYAMO_BOOTSTRAP_ADMIN_PASSWORD:-}"

x-default-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-private-service: &private-service
  restart: unless-stopped
  deploy: *java-limits
  ports: !reset []
  logging: *default-logging
  environment:
    <<: *production-java-env

services:
  postgres:
    extends: { file: docker-compose.yml, service: postgres }
    profiles: ["core", "discovery", "social", "experience", "advanced"]
    logging: *default-logging
    build: { context: ., dockerfile: deploy/postgres-init.Dockerfile }
    restart: unless-stopped
    deploy: *postgres-limits
    ports: !reset []
    volumes: !override
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"

  postgres-init:
    extends: { file: docker-compose.yml, service: postgres-init }
    profiles: ["core", "discovery", "social", "experience", "advanced"]
    logging: *default-logging
    build: { context: ., dockerfile: deploy/postgres-init.Dockerfile }
    restart: "no"
    deploy: *postgres-init-limits
    volumes: !reset []
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      PGPASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      PGHOST: postgres

  redis:
    extends: { file: docker-compose.yml, service: redis }
    profiles: ["core", "discovery", "social", "experience", "advanced"]
    logging: *default-logging
    restart: unless-stopped
    deploy: *redis-limits
    ports: !reset []

  opensearch:
    extends: { file: docker-compose.yml, service: opensearch }
    profiles: ["discovery", "advanced"]
    logging: *default-logging
    restart: unless-stopped
    deploy: *opensearch-limits
    container_name: !reset null
    ports: !reset []

  neo4j:
    extends: { file: docker-compose.yml, service: neo4j }
    profiles: ["advanced"]
    logging: *default-logging
    restart: unless-stopped
    deploy: *neo4j-limits
    ports: !reset []
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}"

  kafka:
    extends: { file: docker-compose.yml, service: kafka }
    profiles: ["core", "discovery", "social", "experience", "advanced"]
    logging: *default-logging
    restart: unless-stopped
    deploy: *kafka-limits
    ports: !reset []

  kafka-init:
    extends: { file: docker-compose.yml, service: kafka-init }
    profiles: ["core", "discovery", "social", "experience", "advanced"]
    logging: *default-logging
    restart: "no"
    deploy: *kafka-init-limits

  config-server:
    extends: { file: docker-compose.yml, service: config-server }
    profiles: ["core", "discovery", "social", "experience", "advanced"]
    logging: *default-logging
    restart: unless-stopped
    deploy: *spring-infra-limits
    ports: !reset []
    volumes: !reset []
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_USERNAME: "${CONFIG_SERVER_USERNAME:?CONFIG_SERVER_USERNAME is required}"
      CONFIG_SERVER_PASSWORD: "${CONFIG_SERVER_PASSWORD:?CONFIG_SERVER_PASSWORD is required}"
      CONFIG_GIT_URI: "${CONFIG_GIT_URI:?CONFIG_GIT_URI is required}"
      CONFIG_GIT_BRANCH: "${CONFIG_GIT_BRANCH:-daryl}"
      CONFIG_GIT_USERNAME: "${CONFIG_GIT_USERNAME:-}"
      CONFIG_GIT_PASSWORD: "${CONFIG_GIT_PASSWORD:-}"
      CONFIG_ENCRYPT_ENABLED: "${CONFIG_ENCRYPT_ENABLED:-false}"
      CONFIG_ENCRYPT_KEYSTORE_LOCATION: "${CONFIG_ENCRYPT_KEYSTORE_LOCATION:-}"
      CONFIG_ENCRYPT_KEYSTORE_PASSWORD: "${CONFIG_ENCRYPT_KEYSTORE_PASSWORD:-}"
      CONFIG_ENCRYPT_KEYSTORE_ALIAS: "${CONFIG_ENCRYPT_KEYSTORE_ALIAS:-}"
      CONFIG_ENCRYPT_KEYSTORE_SECRET: "${CONFIG_ENCRYPT_KEYSTORE_SECRET:-}"

  registry-service:
    extends: { file: docker-compose.yml, service: registry-service }
    profiles: ["core", "discovery", "social", "experience", "advanced"]
    <<: *private-service
    deploy: *spring-infra-limits

  api-gateway:
    extends: { file: docker-compose.yml, service: api-gateway }
    profiles: ["core"]
    <<: *private-service
    expose: ["8083"]
    networks:
      yeyamo-network: {}
      dokploy-network: {}

  auth-service:
    extends: { file: docker-compose.yml, service: auth-service }
    profiles: ["core"]
    <<: *private-service
    environment:
      <<: *production-java-env
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_IDS: "${EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID:-},${EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID:-},${EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID:-}"
      APPLE_CLIENT_ID: "${APPLE_CLIENT_ID:-}"
      TURNSTILE_ENABLED: "${TURNSTILE_ENABLED:-false}"
      TURNSTILE_SECRET_KEY: "${TURNSTILE_SECRET_KEY:-}"
      TURNSTILE_VERIFY_URL: "${TURNSTILE_VERIFY_URL:-https://challenges.cloudflare.com/turnstile/v0/siteverify}"
      TURNSTILE_EXPECTED_HOSTNAME: "${TURNSTILE_EXPECTED_HOSTNAME:-yeyamo.com}"
      LOGIN_TURNSTILE_THRESHOLD: "${LOGIN_TURNSTILE_THRESHOLD:-3}"
  user-service:
    extends: { file: docker-compose.yml, service: user-service }
    profiles: ["core"]
    <<: *private-service
  partner-service:
    extends: { file: docker-compose.yml, service: partner-service }
    profiles: ["experience"]
    <<: *private-service
  campaign-service:
    extends: { file: docker-compose.yml, service: campaign-service }
    profiles: ["advanced"]
    <<: *private-service
  ads-delivery-service:
    extends: { file: docker-compose.yml, service: ads-delivery-service }
    profiles: ["advanced"]
    <<: *private-service
  ticket-service:
    extends: { file: docker-compose.yml, service: ticket-service }
    profiles: ["experience"]
    <<: *private-service
  commerce-service:
    extends: { file: docker-compose.yml, service: commerce-service }
    profiles: ["experience"]
    <<: *private-service
  admin-service:
    extends: { file: docker-compose.yml, service: admin-service }
    profiles: ["advanced"]
    <<: *private-service
  catalog-service:
    extends: { file: docker-compose.yml, service: catalog-service }
    profiles: ["discovery"]
    <<: *private-service
  place-service:
    extends: { file: docker-compose.yml, service: place-service }
    profiles: ["discovery"]
    <<: *private-service
  event-service:
    extends: { file: docker-compose.yml, service: event-service }
    profiles: ["experience"]
    <<: *private-service
  content-service:
    extends: { file: docker-compose.yml, service: content-service }
    profiles: ["social"]
    <<: *private-service
  interaction-service:
    extends: { file: docker-compose.yml, service: interaction-service }
    profiles: ["social"]
    <<: *private-service
  feed-service:
    extends: { file: docker-compose.yml, service: feed-service }
    profiles: ["social"]
    <<: *private-service
  discovery-service:
    extends: { file: docker-compose.yml, service: discovery-service }
    profiles: ["discovery"]
    <<: *private-service
  recommendation-service:
    extends: { file: docker-compose.yml, service: recommendation-service }
    profiles: ["advanced"]
    <<: *private-service
  gamification-service:
    extends: { file: docker-compose.yml, service: gamification-service }
    profiles: ["advanced"]
    <<: *private-service
  mission-reward-service:
    extends: { file: docker-compose.yml, service: mission-reward-service }
    profiles: ["advanced"]
    <<: *private-service
  referral-service:
    extends: { file: docker-compose.yml, service: referral-service }
    profiles: ["advanced"]
    <<: *private-service
  moderation-trust-service:
    extends: { file: docker-compose.yml, service: moderation-trust-service }
    profiles: ["advanced"]
    <<: *private-service
  media-service:
    extends: { file: docker-compose.yml, service: media-service }
    profiles: ["discovery"]
    <<: *private-service
    environment:
      <<: *production-java-env
      R2_ACCOUNT_ID: "${R2_ACCOUNT_ID:?R2_ACCOUNT_ID is required}"
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID is required}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY is required}"
      R2_PUBLIC_BUCKET_NAME: "${R2_PUBLIC_BUCKET_NAME:?R2_PUBLIC_BUCKET_NAME is required}"
      R2_PRIVATE_BUCKET_NAME: "${R2_PRIVATE_BUCKET_NAME:?R2_PRIVATE_BUCKET_NAME is required}"
      R2_PUBLIC_BASE_URL: "${R2_PUBLIC_BASE_URL:-}"
      R2_ENABLED: "true"
      MEDIA_STORAGE_LOCAL_ENABLED: "false"
  notification-service:
    extends: { file: docker-compose.yml, service: notification-service }
    profiles: ["social"]
    <<: *private-service
  booking-service:
    extends: { file: docker-compose.yml, service: booking-service }
    profiles: ["experience"]
    <<: *private-service
  payment-service:
    extends: { file: docker-compose.yml, service: payment-service }
    profiles: ["experience"]
    <<: *private-service
    environment:
      <<: *production-java-env
      SPRING_PROFILES_ACTIVE: prod
  messaging-service:
    extends: { file: docker-compose.yml, service: messaging-service }
    profiles: ["social"]
    <<: *private-service
  support-service:
    extends: { file: docker-compose.yml, service: support-service }
    profiles: ["advanced"]
    <<: *private-service
  culture-service:
    extends: { file: docker-compose.yml, service: culture-service }
    profiles: ["experience"]
    <<: *private-service
  graph-service:
    extends: { file: docker-compose.yml, service: graph-service }
    profiles: ["advanced"]
    <<: *private-service
  country-config-service:
    extends: { file: docker-compose.yml, service: country-config-service }
    profiles: ["discovery"]
    <<: *private-service
  analytics-service:
    extends: { file: docker-compose.yml, service: analytics-service }
    profiles: ["advanced"]
    <<: *private-service
  ingestion-service:
    extends: { file: docker-compose.yml, service: ingestion-service }
    profiles: ["advanced"]
    <<: *private-service

volumes:
  postgres-data:
  redis-data:
  redpanda-data:
  opensearch-data:
  neo4j-data:
  media-storage:

networks:
  yeyamo-network:
    driver: bridge
  dokploy-network:
    external: true
    name: "${DOKPLOY_NETWORK:-dokploy-network}"
