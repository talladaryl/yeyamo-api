spring.application.name=ads-delivery-service
server.port=8095

# Config Server
spring.cloud.config.enabled=true
spring.cloud.config.uri=http://localhost:8888
spring.cloud.config.fail-fast=false

# Eureka
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
spring.cloud.discovery.enabled=true

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/yeyamo_ads
spring.datasource.username=${ADS_DB_USERNAME:yeyamo}
spring.datasource.password=${ADS_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=ads-delivery-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Kafka Topics
yeyamo.kafka.topics.campaign-events=campaign-events
yeyamo.kafka.topics.ad-events=ad-events

# Feature Flags (all disabled by default)
yeyamo.ads.feature-flags.ads-delivery-enabled=false
yeyamo.ads.feature-flags.ads-feed-enabled=false
yeyamo.ads.feature-flags.ads-discovery-enabled=false
yeyamo.ads.feature-flags.ads-search-enabled=false
yeyamo.ads.feature-flags.ads-map-enabled=false
yeyamo.ads.feature-flags.ads-event-highlight-enabled=false
yeyamo.ads.feature-flags.ads-place-highlight-enabled=false
yeyamo.ads.feature-flags.ads-partner-profile-banner-enabled=false

# Ad Delivery Configuration
yeyamo.ads.tracking-token.secret=${ADS_TOKEN_SECRET}
yeyamo.ads.tracking-token.expiration-seconds=300
yeyamo.ads.frequency-cap.default-daily-limit=5
yeyamo.ads.frequency-cap.default-hourly-limit=2
yeyamo.ads.budget-reservation.ttl-seconds=60
yeyamo.ads.qualified-impression.min-view-duration-ms=1000

# Circuit Breaker
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=5
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10000
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true

# Security (OAuth2 Resource Server)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/yeyamo

# OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.show-actuator=true

# Logging
logging.level.com.yeyamo_mobile.api.ads_delivery_service=DEBUG
logging.level.org.springframework.kafka=INFO
logging.level.org.springframework.data.redis=INFO
