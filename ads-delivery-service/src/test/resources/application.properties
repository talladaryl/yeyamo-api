spring.application.name=ads-delivery-service-test

# Disable external services
spring.cloud.config.enabled=false
spring.cloud.discovery.enabled=false

# H2 Database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none

# Flyway for H2
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/h2

# Embedded Redis (use embedded or mock)
spring.data.redis.host=localhost
spring.data.redis.port=6370

# Kafka disabled for tests
spring.kafka.bootstrap-servers=localhost:9092
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# Disable Kafka listeners in tests
yeyamo.kafka.enabled=false

# Kafka topics (needed for @KafkaListener annotation processing)
yeyamo.kafka.topics.campaign-events=campaign-events
yeyamo.kafka.topics.ad-events=ad-events
spring.kafka.consumer.group-id=ads-delivery-service-test

# Feature flags for tests
yeyamo.ads.feature-flags.ads-delivery-enabled=true
yeyamo.ads.feature-flags.ads-feed-enabled=true

# Test config
yeyamo.ads.tracking-token.secret=test-secret-key-for-unit-tests-only
yeyamo.ads.tracking-token.expiration-seconds=300

logging.level.com.yeyamo_mobile.api.ads_delivery_service=DEBUG
