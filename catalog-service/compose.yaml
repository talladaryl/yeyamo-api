services:
  catalog-db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: yeyamo_catalog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5438:5432"
    volumes:
      - catalog-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yeyamo_catalog"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: redpandadata/redpanda:v24.3.6
    command: ["redpanda", "start", "--overprovisioned", "--smp", "1", "--memory", "512M", "--reserve-memory", "0M", "--node-id", "0", "--check=false", "--kafka-addr", "0.0.0.0:9092", "--advertise-kafka-addr", "kafka:9092"]
    ports:
      - "19092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 20

  catalog-service:
    build: .
    environment:
      SPRING_CLOUD_CONFIG_ENABLED: "false"
      EUREKA_CLIENT_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://catalog-db:5432/yeyamo_catalog
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: local-docker-secret-change-me-1234567890
    ports:
      - "8088:8088"
    depends_on:
      catalog-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  catalog-postgres:
