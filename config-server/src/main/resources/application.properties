spring.application.name=config-server
server.port=${SERVER_PORT:8080}
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=${CONFIG_REPOSITORY_URI:file:../cloud-conf-yeyamo}
spring.cloud.config.server.native.add-label-locations=false
spring.cloud.config.server.accept-empty=false
spring.security.user.name=${CONFIG_SERVER_USERNAME}
spring.security.user.password=${CONFIG_SERVER_PASSWORD}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Centralized configuration server for YeYamo microservices
logging.level.org.springframework.cloud.config=INFO
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-}] %logger{36} - %msg%n
