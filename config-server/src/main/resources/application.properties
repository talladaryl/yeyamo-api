spring.application.name=config-server

server.port=${SERVER_PORT:8080}


# ============================================
# SPRING CLOUD CONFIG SERVER
# ============================================

# Local development defaults to the native backend. Production selects the
# dedicated `prod` profile through SPRING_PROFILES_ACTIVE=prod.
spring.profiles.default=native


# ============================================
# SECURITY
# ============================================

spring.security.user.name=${CONFIG_SERVER_USERNAME:admin}

spring.security.user.password=${CONFIG_SERVER_PASSWORD:admin123}


# ============================================
# ACTUATOR
# ============================================

management.endpoints.web.exposure.include=health,info,metrics

management.endpoint.health.show-details=always

management.endpoint.health.probes.enabled=true

management.health.livenessstate.enabled=true

management.health.readinessstate.enabled=true

management.endpoint.health.group.readiness.include=readinessState

management.endpoint.health.group.liveness.include=livenessState


# ============================================
# INFO
# ============================================

management.info.env.enabled=true

info.app.name=${spring.application.name}

info.app.description=Centralized configuration server for YeYamo microservices


# ============================================
# LOGGING
# ============================================

logging.level.org.springframework.cloud.config=INFO

logging.level.org.springframework.boot.actuate=INFO

logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-}] %logger{36} - %msg%n
