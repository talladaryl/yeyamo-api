spring.cloud.config.enabled=false
eureka.client.enabled=false
spring.datasource.url=jdbc:h2:mem:gamification_service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=false
spring.kafka.listener.auto-startup=false
spring.data.redis.repositories.enabled=false
management.health.redis.enabled=false
jwt.secret=test-gamification-secret-that-is-at-least-thirty-two-bytes
gamification.outbox.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.security.oauth2.server.resource.autoconfigure.servlet.OAuth2ResourceServerAutoConfiguration
