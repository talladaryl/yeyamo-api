# Test Configuration
spring.application.name=country-config-service-test

# Disable Cloud Config for tests
spring.cloud.config.enabled=false
spring.cloud.discovery.enabled=false

# H2 In-Memory Database for tests
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true

# Disable Redis for tests
spring.cache.type=none
spring.data.redis.repositories.enabled=false

# Disable Kafka for tests
spring.kafka.bootstrap-servers=
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# Disable security for tests
spring.security.oauth2.resourceserver.jwt.issuer-uri=
spring.autoconfigure.exclude[0]=org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration

# Logging
logging.level.root=INFO
logging.level.com.yeyamo_mobile.api.country_config_service=DEBUG
