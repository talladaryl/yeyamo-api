# Test configuration
spring.application.name=ticket-service-test

# JPA
spring.cloud.config.enabled=false
spring.cloud.discovery.enabled=false
eureka.client.enabled=false
spring.datasource.url=jdbc:h2:mem:ticket_service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

# Flyway disabled for tests (using JPA DDL)
spring.flyway.enabled=false

# Redis (embedded for tests)
spring.data.redis.repositories.enabled=false
management.health.redis.enabled=false

# Kafka is disabled for H2 unit and integration tests.
spring.kafka.listener.auto-startup=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration,org.springframework.boot.security.oauth2.server.resource.autoconfigure.servlet.OAuth2ResourceServerAutoConfiguration,org.redisson.spring.starter.RedissonAutoConfigurationV2

# Security disabled for tests
spring.security.oauth2.resourceserver.jwt.issuer-uri=
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=
jwt.secret=test-ticket-secret-that-is-at-least-thirty-two-bytes

# Logging
logging.level.com.yeyamo_mobile.api.ticket_service=DEBUG
logging.level.org.hibernate.SQL=DEBUG
