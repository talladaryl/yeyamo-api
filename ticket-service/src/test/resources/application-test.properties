spring.application.name=ticket-service-test

# Disable external services
spring.cloud.config.enabled=false
spring.cloud.discovery.enabled=false
eureka.client.enabled=false

# H2 Database for tests
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# Redis (embedded or mock)
spring.data.redis.host=localhost
spring.data.redis.port=6370

# Kafka disabled for tests
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=ticket-service-test

# Business rules (shorter for tests)
yeyamo.tickets.hold-ttl-minutes=1
yeyamo.tickets.max-per-buyer=10
yeyamo.tickets.service-fee-percent=5.0

# QR
yeyamo.tickets.qr.token-ttl-days=30
yeyamo.tickets.qr.algorithm=RS256

# Logging
logging.level.com.yeyamo_mobile.api.ticket_service=DEBUG
