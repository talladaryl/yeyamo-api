x-java-service-env: &java-service-env
  JAVA_TOOL_OPTIONS: "${JAVA_TOOL_OPTIONS:--Xms64m -Xmx256m -XX:+UseSerialGC}"
  # Un `docker compose up --build` démarre plus de vingt JVM. Le Config Server
  # peut répondre lentement pendant ce pic CPU : laisser assez de temps évite
  # les ConfigClientFailFastException observées au premier démarrage.
  SPRING_CLOUD_CONFIG_REQUEST_CONNECT_TIMEOUT: "30000"
  SPRING_CLOUD_CONFIG_REQUEST_READ_TIMEOUT: "180000"

x-java-limits: &java-limits
  resources:
    limits:
      cpus: "${JAVA_CPU_LIMIT:-1.0}"
      memory: "${JAVA_MEMORY_LIMIT:-512M}"

services:
  # ============================================
  # INFRASTRUCTURE - Bases de données
  # ============================================
  
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: |
        yeyamo_auth,yeyamo_user,yeyamo_partner,yeyamo_admin,yeyamo_catalog,
        yeyamo_place,yeyamo_content,yeyamo_interaction,yeyamo_event,
        yeyamo_booking,yeyamo_payment,yeyamo_notification,yeyamo_moderation,yeyamo_support,
        yeyamo_referral,yeyamo_gamification,yeyamo_mission,yeyamo_ingestion,
        yeyamo_feed,yeyamo_media,yeyamo_discovery,yeyamo_recommendation,
        yeyamo_campaign,yeyamo_ads,yeyamo_ticket,yeyamo_commerce,yeyamo_analytics
    command: 
      - "postgres"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=256MB"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10m
    networks:
      - yeyamo-network

  postgres-init:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      PGPASSWORD: postgres
      PGHOST: postgres
      POSTGRES_MULTIPLE_DATABASES: |
        yeyamo_auth,yeyamo_user,yeyamo_partner,yeyamo_admin,yeyamo_catalog,
        yeyamo_place,yeyamo_content,yeyamo_interaction,yeyamo_event,
        yeyamo_booking,yeyamo_payment,yeyamo_notification,yeyamo_moderation,yeyamo_support,
        yeyamo_referral,yeyamo_gamification,yeyamo_mission,yeyamo_ingestion,
        yeyamo_feed,yeyamo_media,yeyamo_discovery,yeyamo_recommendation,
        yeyamo_campaign,yeyamo_ads,yeyamo_ticket,yeyamo_commerce,yeyamo_analytics
    volumes:
      - ./scripts/init-multiple-databases.sh:/init-multiple-databases.sh:ro
    entrypoint: ["bash", "/init-multiple-databases.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - yeyamo-network

  cassandra:
    image: cassandra:5.0
    init: true
    environment:
      CASSANDRA_CLUSTER_NAME: yeyamo
      CASSANDRA_DC: datacenter1
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    ports:
      - "9042:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e \"CREATE KEYSPACE IF NOT EXISTS yeyamo_messaging WITH replication = {'class':'SimpleStrategy','replication_factor':1};\" && cqlsh -e 'DESCRIBE CLUSTER'"]
      interval: 15s
      timeout: 30s
      retries: 20
      start_period: 90s
    networks:
      - yeyamo-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - yeyamo-network

  opensearch:
    image: opensearchproject/opensearch:3.2.0
    container_name: yeyamo-opensearch

    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"

      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"

      DISABLE_SECURITY_PLUGIN: "true"

    ulimits:
      memlock:
        soft: -1
        hard: -1

    ports:
      - "9200:9200"
      - "9600:9600"

    volumes:
      - opensearch-data:/usr/share/opensearch/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:9200/_cluster/health || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 10m

    networks:
      - yeyamo-network
  # neo4j:
  #   image: neo4j:5.24-community
