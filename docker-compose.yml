  kafka:
    image: redpandadata/redpanda:v24.3.6
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - 0.0.0.0:9092
      - --advertise-kafka-addr
      - kafka:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - yeyamo-network

  # ============================================
  # INFRASTRUCTURE - Services Spring Cloud
  # ============================================

  config-server:
    build: ./config-server
    environment:
      <<: *java-service-env
      SPRING_PROFILES_ACTIVE: native
      CONFIG_SERVER_USERNAME: admin
      CONFIG_SERVER_PASSWORD: admin123
    ports:
      - "8080:8080"
    volumes:
      - ./cloud-conf-yeyamo:/config:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep UP || exit 1"]
      interval: 10s
      timeout: 5s 
      retries: 15
      start_period: 90s
    networks:
      - yeyamo-network


  registry-service:
    build: ./registry-service
    environment:
      <<: *java-service-env
      CONFIG_SERVER_URL: http://config-server:8080
      CONFIG_SERVER_USERNAME: admin
      CONFIG_SERVER_PASSWORD: admin123
      EUREKA_HOSTNAME: registry-service
      EUREKA_USERNAME: eureka
      EUREKA_PASSWORD: eureka123
      SERVER_PORT: 8761
    ports:
      - "8761:8761"
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    networks:
      - yeyamo-network

  api-gateway:
    build: ./api-gateway
    environment:
      <<: *java-service-env
      CONFIG_SERVER_URL: http://config-server:8080
      CONFIG_SERVER_USERNAME: admin
      CONFIG_SERVER_PASSWORD: admin123
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:eureka123@registry-service:8761/eureka
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: local-docker-secret-change-me-1234567890
    ports:
      - "8083:8083"
    depends_on:
      config-server:
        condition: service_healthy
      registry-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - yeyamo-network

