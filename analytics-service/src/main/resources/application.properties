spring.application.name=analytics-service
spring.cloud.config.username=${CONFIG_SERVER_USERNAME}
spring.cloud.config.password=${CONFIG_SERVER_PASSWORD}
spring.config.import=configserver:${CONFIG_SERVER_URL:http://config-server:8080}
spring.cloud.config.fail-fast=true
analytics.privacy.minimum-segment-size=${ANALYTICS_MIN_SEGMENT_SIZE:5}
analytics.cache.ttl-seconds=${ANALYTICS_CACHE_TTL_SECONDS:30}
yeyamo.kafka.consumer.topics=${ANALYTICS_TOPICS:ad-events,campaign-events,ticket.events,ticket.scan.events,payment.events,commerce.events}
management.endpoints.web.exposure.include=health,info,prometheus,metrics
