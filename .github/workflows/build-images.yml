name: Build and publish service images

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish images to GHCR after the build
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  MAVEN_THREADS: "1"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package the Maven reactor once
        run: ./auth-service/mvnw -f pom.xml -B -ntp -T "${MAVEN_THREADS}" install -DskipTests
      - name: Preserve packaged service jars
        uses: actions/upload-artifact@v4
        with:
          name: maven-service-jars
          path: "*/target/*-0.0.1-SNAPSHOT.jar"
          if-no-files-found: error

  images:
    needs: package
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {service: config-server, port: 8080}
          - {service: registry-service, port: 8761}
          - {service: api-gateway, port: 8083}
          - {service: auth-service, port: 8082}
          - {service: user-service, port: 8086}
          - {service: partner-service, port: 8087}
          - {service: campaign-service, port: 8110}
          - {service: ads-delivery-service, port: 8111}
          - {service: ticket-service, port: 8112}
          - {service: commerce-service, port: 8113}
          - {service: admin-service, port: 8096}
          - {service: catalog-service, port: 8088}
          - {service: place-service, port: 8084}
          - {service: content-service, port: 8090}
          - {service: interaction-service, port: 8091}
          - {service: feed-service, port: 8092}
          - {service: media-service, port: 8101}
          - {service: moderation-trust-service, port: 8100}
          - {service: event-service, port: 8085}
          - {service: booking-service, port: 8102}
          - {service: payment-service, port: 8103}
          - {service: messaging-service, port: 8104}
          - {service: notification-service, port: 8094}
          - {service: support-service, port: 8114}
          - {service: culture-service, port: 8115}
          - {service: gamification-service, port: 8105}
          - {service: mission-reward-service, port: 8098}
          - {service: recommendation-service, port: 8095}
          - {service: referral-service, port: 8099}
          - {service: analytics-service, port: 8097}
          - {service: ingestion-service, port: 8089}
          - {service: discovery-service, port: 8093}
          - {service: graph-service, port: 8116}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: maven-service-jars
          path: .
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          file: deploy/runtime.Dockerfile
          build-args: |
            SERVICE_MODULE=${{ matrix.service }}
            SERVICE_PORT=${{ matrix.port }}
          push: ${{ inputs.publish }}
          tags: ghcr.io/${{ github.repository_owner }}/yeyamo-${{ matrix.service }}:sha-${{ github.sha }}
