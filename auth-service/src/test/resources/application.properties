spring.cloud.config.enabled=false
eureka.client.enabled=false
server.port=0
spring.datasource.url=jdbc:h2:mem:yeyamo_auth;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.kafka.listener.auto-startup=false
yeyamo.outbox.publish-delay-ms=3600000
spring.data.redis.host=localhost
jwt.secret=testSecretKey123456789012345678901234567890
jwt.access-token-expiration=1800000
jwt.issuer=https://auth.yeyamo.test
jwt.audience=yeyamo-api
jwt.key-id=test-key-1
jwt.refresh-token-expiration=2592000000
otp.expiration-minutes=10
otp.max-attempts=3
spring.mail.host=localhost
spring.mail.port=2525
auth.email.delivery-enabled=false
auth.email.from-address=test@yeyamo.invalid
auth.email.from-name=YeYamo
oauth.google.client-id=test-google
oauth.apple.client-id=test-apple
security.turnstile.enabled=false
security.login-turnstile-threshold=3
logging.level.org.springframework.web.client=INFO
management.health.redis.enabled=false
management.health.kafka.enabled=false
yeyamo.services.country-config.url=http://localhost:8117
