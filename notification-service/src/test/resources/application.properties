spring.cloud.config.enabled=false
eureka.client.enabled=false
spring.datasource.url=jdbc:h2:mem:notification_service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.kafka.listener.auto-startup=false
spring.task.scheduling.enabled=false
spring.mail.host=localhost
spring.mail.port=1025
notification.email.delivery-enabled=false
notification.email.from-address=test@yeyamo.invalid
notification.email.from-name=YeYamo
jwt.secret=test-notification-secret-that-is-at-least-thirty-two-bytes
spring.autoconfigure.exclude=org.springframework.boot.security.oauth2.server.resource.autoconfigure.servlet.OAuth2ResourceServerAutoConfiguration
