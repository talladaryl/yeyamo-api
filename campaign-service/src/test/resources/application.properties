spring.application.name=campaign-service-test

# Disable config server for tests
spring.cloud.config.enabled=false
spring.cloud.discovery.enabled=false

# In-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none

# Flyway - use H2-specific migrations for tests
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/h2

# Kafka disabled for unit tests
spring.kafka.bootstrap-servers=
spring.kafka.enabled=false

# Service URLs
yeyamo.services.place-service.url=http://localhost:8081
yeyamo.services.event-service.url=http://localhost:8082
yeyamo.services.content-service.url=http://localhost:8083
yeyamo.services.partner-service.url=http://localhost:8084

# Logging
logging.level.com.yeyamo_mobile.api.campaign_service=DEBUG

jwt.secret=testSecretKey123456789012345678901234567890
jwt.issuer=https://auth.yeyamo.internal
jwt.audience=yeyamo-api
