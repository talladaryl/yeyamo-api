spring.application.name=campaign-service
spring.cloud.config.username=${CONFIG_SERVER_USERNAME}
spring.cloud.config.password=${CONFIG_SERVER_PASSWORD}
spring.config.import=configserver:${CONFIG_SERVER_URL:http://config-server:8080}
spring.cloud.config.fail-fast=true
spring.cloud.config.request-connect-timeout=10000
spring.cloud.config.request-read-timeout=30000
spring.cloud.config.retry.max-attempts=6
spring.cloud.config.retry.initial-interval=2000
spring.cloud.config.retry.max-interval=3000
spring.cloud.config.retry.multiplier=1.2

# Kafka Topics
yeyamo.kafka.topics.campaign-events=campaign-events

# Outbox Publisher
yeyamo.outbox.publish-delay-ms=1000

# Service URLs for validation
yeyamo.services.place-service.url=${PLACE_SERVICE_URL:http://place-service:8080}
yeyamo.services.event-service.url=${EVENT_SERVICE_URL:http://event-service:8080}
yeyamo.services.content-service.url=${CONTENT_SERVICE_URL:http://content-service:8080}
yeyamo.services.partner-service.url=${PARTNER_SERVICE_URL:http://partner-service:8080}

# Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.partnerValidation.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.partnerValidation.wait-duration-in-open-state=30000
resilience4j.circuitbreaker.instances.partnerValidation.sliding-window-size=10

resilience4j.circuitbreaker.instances.entityValidation.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.entityValidation.wait-duration-in-open-state=30000
resilience4j.circuitbreaker.instances.entityValidation.sliding-window-size=10
