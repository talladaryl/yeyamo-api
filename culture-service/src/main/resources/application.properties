spring.application.name=culture-service
spring.cloud.config.username=${CONFIG_SERVER_USERNAME}
spring.cloud.config.password=${CONFIG_SERVER_PASSWORD}
spring.config.import=configserver:${CONFIG_SERVER_URL:http://config-server:8080}
spring.cloud.config.fail-fast=true
culture.events.topic=${CULTURE_EVENTS_TOPIC:culture.events}
yeyamo.media-service.url=${MEDIA_SERVICE_URL:http://media-service:8080}
yeyamo.service-auth.culture-media.current-secret=${CULTURE_MEDIA_SERVICE_JWT_SECRET:}
yeyamo.service-auth.culture-media.ttl=${CULTURE_MEDIA_SERVICE_JWT_TTL:PT2M}
